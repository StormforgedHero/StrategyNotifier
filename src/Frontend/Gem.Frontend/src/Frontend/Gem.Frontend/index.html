<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="1; url=/">
  <title>GEM Frontend</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0a111f; color: #e9f1ff; margin: 0; display: grid; place-items: center; min-height: 100vh; padding: 24px; text-align: center; }
    .card { max-width: 520px; background: #0f1829; border: 1px solid #1c2a40; border-radius: 12px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
    h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: 0.02em; }
    p { margin: 6px 0; color: #c2d4f2; }
    a { color: #8ab4f8; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Demo mode / zły adres</h1>
    <p>Open <a href="/">http://localhost:8000/</a> to view the demo. Jeśli widzisz ten ekran, wróć na adres główny.</p>
    <p>For live data, serve the repo root and open <a href="/">/</a>.</p>
  </div>
</body>
</html>
